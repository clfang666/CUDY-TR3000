#
# Unified CUDY TR3000 firmware builder
# Based on https://github.com/P3TERX/Actions-OpenWrt
#

name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.config'
      - 'diy-part*.sh'
      - '.github/workflows/openwrt-builder.yml'

permissions:
  actions: write
  contents: write

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ matrix.device }} / ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - config_file: TR3000V1_MOD.config
            device: ubootmod
            variant: standard
          - config_file: TR3000V1_MOD.config
            device: ubootmod
            variant: openclash
          - config_file: TR3000V1_256M.config
            device: 256mb
            variant: standard
          - config_file: TR3000V1_256M.config
            device: 256mb
            variant: openclash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$(id -u):$(id -g)" /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT "$PWD"
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Load custom feeds
        run: |
          [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          cp "${{ matrix.config_file }}" openwrt/.config
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          if [ "${{ matrix.variant }}" = "openclash" ]; then
            ./scripts/config --file .config --keep-case --enable PACKAGE_luci-app-openclash
          fi

      - name: Download packages
        run: |
          cd openwrt
          make defconfig
          if [ "${{ matrix.variant }}" = "openclash" ]; then
            grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config
          elif grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config; then
            echo 'standard variant unexpectedly enabled OpenClash' >&2
            exit 1
          fi
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) thread compile"
          make -j"$(nproc)" || make -j1 || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "device_name=_$(cat DEVICE_NAME)" >> "$GITHUB_OUTPUT"

      - name: Check space usage
        if: ${{ !cancelled() }}
        run: df -hT

      - name: Upload bin directory
        if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.device }}-${{ matrix.variant }}
          path: openwrt/bin
          retention-days: 7

      - name: Organize firmware files
        id: organize
        if: ${{ env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          for firmware in *sysupgrade*; do
            [ -f "$firmware" ] || continue
            extension="${firmware##*.}"
            stem="${firmware%.*}"
            mv "$firmware" "${stem}-${{ matrix.variant }}.${extension}"
          done
          echo "firmware_dir=$PWD" >> "$GITHUB_OUTPUT"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        if: ${{ steps.organize.outputs.status == 'success' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.device }}-${{ matrix.variant }}
          path: ${{ steps.organize.outputs.firmware_dir }}/*sysupgrade*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish unified release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true

      - name: Generate release information
        id: release_info
        run: |
          echo "release_tag=$(date +'%Y.%m.%d')-run${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            '本次发布同时包含 standard（基础版）和 openclash（内置 OpenClash）固件。' \
            '请根据设备目标选择 256mb 或 ubootmod，并在刷写前核对文件名。' \
            > release.txt

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.release_tag }}
          body_path: release.txt
          files: firmware/*sysupgrade*

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 2

      - name: Remove old releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
